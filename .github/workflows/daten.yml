# Bereitet die Schotterwege und Orte auf und veröffentlicht App + Daten auf GitHub Pages.
#
# Läuft automatisch jeden Montag früh, außerdem von Hand:
#   GitHub → Reiter "Actions" → "Kartendaten aufbereiten" → "Run workflow"
#
# Wird nur die App (index.html) geändert, werden die zuletzt erzeugten Daten wiederverwendet
# (kein neues Aufbereiten nötig, dauert dann nur ca. 1 Minute).

name: Kartendaten aufbereiten

on:
  schedule:
    - cron: '0 2 * * 1'        # jeden Montag 02:00 UTC (= 03:00/04:00 Uhr in Österreich)
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur diese Länder (IDs aus regions.json, kommagetrennt) – leer = alle aktiven'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', '*.png', 'regions.json', 'build/**', '.github/workflows/daten.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Neu aufbereiten bei: Zeitplan, Start von Hand – und IMMER dann, wenn sich Skript oder Länderliste seit dem
      # gespeicherten Datenstand geändert haben. Dafür bekommt jeder Datenstand einen "Fingerabdruck" (Prüfsumme von
      # regions.json + build/) mit. So geht eine Skript-Änderung nicht verloren, auch wenn GitHub einzelne Läufe
      # abbricht (mehrere Dateien einzeln hochgeladen = mehrere Läufe, wartende werden durch neuere ersetzt).
      # Bei reiner App-Änderung genügen die gespeicherten Daten vom letzten Lauf (dauert dann nur ca. 1 Minute).
      - name: Fingerabdruck von Skript und Länderliste
        id: fp
        run: |
          hash=$(cat regions.json build/build_tiles.py build/requirements.txt | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Fingerabdruck: $hash"

      - name: Letzte Daten wiederherstellen
        id: cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: kartendaten-v2-${{ github.run_id }}
          restore-keys: kartendaten-v2-

      - name: Entscheiden, ob neu aufbereitet wird
        id: need
        env:
          EVENT: ${{ github.event_name }}
          HASH: ${{ steps.fp.outputs.hash }}
        run: |
          build=true
          old=$(cat site/data/.buildhash 2>/dev/null || echo "keiner")
          echo "Fingerabdruck der gespeicherten Daten: $old"
          if [ "$EVENT" = "push" ] && [ "$old" = "$HASH" ]; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Neu aufbereiten: $build"

      # Große Länder (Deutschland, Frankreich: je > 4 GB) brauchen Platz – vorinstallierte,
      # hier nicht benötigte Programme entfernen (schafft ca. 30 GB)
      - name: Speicherplatz schaffen
        if: steps.need.outputs.build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-python@v5
        if: steps.need.outputs.build == 'true'
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren
        if: steps.need.outputs.build == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q -r build/requirements.txt

      - name: Daten aufbereiten
        if: steps.need.outputs.build == 'true'
        run: |
          python build/build_tiles.py --out site/data/v2 --only "${{ github.event.inputs.nur }}"
          # Fingerabdruck nur bei vollständigem Lauf merken (Teil-Läufe "nur diese Länder" sind Tests)
          if [ -z "${{ github.event.inputs.nur }}" ]; then echo "${{ steps.fp.outputs.hash }}" > site/data/.buildhash; fi

      - name: Daten für spätere App-Updates merken
        if: steps.need.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: kartendaten-v2-${{ github.run_id }}

      - name: App dazulegen
        run: |
          cp index.html site/
          # App-Dateien zum Installieren (Symbol, Vollbild, Start ohne Netz)
          for f in manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            if [ -f "$f" ]; then cp "$f" site/; else echo "Fehlt (noch nicht hochgeladen): $f"; fi
          done
          touch site/.nojekyll
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
